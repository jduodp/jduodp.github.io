 <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Dialpad's PhoneBridge Widget</title>
      <style>
        body, #zoho-cti-app {
          width: 472px;
          height: 610px;
          margin: 0;
          padding: 0;
          border: 0;
        }
        iframe.zoho-cti-iframe {
          width: 472px;
          height: 610px;
          border-radius: 10px;
          border: 0.5px solid grey;
        }
      </style>
    </head>
    <body>
      <div>
        <iframe
          id="cti-iframe"
          class="zoho-cti-iframe"
          title="Dialpad"
          allow="microphone; speaker-selection; autoplay; camera; display-capture; hid"
          sandbox="allow-popups allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>
      <script>
        const DIALPAD_ORIGIN = 'https://dialpadbeta.com';

        let ctiIframeUrl = DIALPAD_ORIGIN + '/apps/zoho';
        const zohoOrigin = 'https://phonebridge.zoho.com';
        const ctiIframeId = 'cti-iframe';
        const ctiIframe = document.getElementById(ctiIframeId);
        let ctiOrigin = DIALPAD_ORIGIN;

        function parseCtiIframeUrl(url) {
          if (typeof url !== 'string' || !url.trim()) {
            console.warn('DP-ZPB-BROKER', 'Ignoring empty CTI iframe URL');
            return null;
          }
          try {
            return new URL(url, DIALPAD_ORIGIN);
          } catch (error) {
            console.warn('DP-ZPB-BROKER', 'Ignoring invalid CTI iframe URL', url, error);
            return null;
          }
        }

        function updateCtiIframeUrl(url) {
          const parsedUrl = parseCtiIframeUrl(url);
          if (!parsedUrl) {
            return false;
          }
          if (parsedUrl.origin !== DIALPAD_ORIGIN) {
            console.warn(
              'DP-ZPB-BROKER',
              `Ignoring CTI iframe URL for unexpected origin=${parsedUrl.origin}`
            );
            return false;
          }
          ctiIframeUrl = parsedUrl.href;
          ctiOrigin = parsedUrl.origin;
          ctiIframe.src = ctiIframeUrl;
          return true;
        }

        function receiveEvents(evt) {
          console.debug('DP-ZPB-BROKER', `Zoho PB Widget received event origin=${evt.origin}`);
          console.debug(evt.data);
          if (evt.origin === zohoOrigin) {
            console.debug('DP-ZPB-BROKER', `Forwarding to ${ctiOrigin}`);
            ctiIframe.contentWindow.postMessage(evt.data, ctiOrigin);
          } else if (evt.origin === ctiOrigin) {
            if (evt.data && evt.data.method === 'change_cti_iframe_url') {
              updateCtiIframeUrl(evt.data.url);
              return;
            }
            console.debug('DP-ZPB-BROKER', `Forwarding to ${zohoOrigin}`);
            parent.postMessage(evt.data, zohoOrigin);
          }
        }

        (function() {
          window.addEventListener('message', receiveEvents, false);
          updateCtiIframeUrl(ctiIframeUrl);
        })();
      </script>
    </body>
  </html>
